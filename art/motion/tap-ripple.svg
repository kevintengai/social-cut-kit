<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tap Ripple</title>
  <desc id="desc">Mark A Tap Target With Two Outward Ripples.</desc>
  <style>
    .ring{transform-origin:32px 32px;animation:pulse 2.4s ease-out infinite}@keyframes pulse{0%,12%{transform:scale(.55);opacity:0}30%{opacity:1}86%,100%{transform:scale(1.28);opacity:0}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g fill="none" stroke="#E7F4FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <g class="ring"><circle cx="32" cy="32" r="13"/><circle cx="32" cy="32" r="20" opacity=".45"/></g><circle cx="32" cy="32" r="6" fill="#5EE1C7" stroke="none"/>
  </g>
</svg>
