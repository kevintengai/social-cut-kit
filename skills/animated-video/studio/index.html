<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Studio | TENG AI SCHOOL</title>
  <link rel="stylesheet" href="studio.css">
  <script defer src="project.js"></script>
  <script defer src="sound.js"></script>
  <script defer src="marks.js"></script>
  <script defer src="space.js"></script>
  <script defer src="kit.js"></script>
  <script defer src="timing.js"></script>
  <script defer src="scenes.js"></script>
  <script defer src="captions.js"></script>
  <script defer src="frame.js"></script>
  <script defer src="../parts/character.js"></script>
  <script defer src="../parts/chart.js"></script>
  <script defer src="../parts/globe.js"></script>
  <script defer src="../parts/phone.js"></script>
  <script defer src="editor.js"></script>
</head>
<body>
  <header class="mast"><div class="identity"><span class="brand">TENG AI SCHOOL</span><h1>Motion Studio</h1></div>
    <nav aria-label="Project Files"><label class="fileButton">Open Storyboard<input id="openFile" type="file" multiple accept=".json,application/json,.js,audio/*,.wav,.mp3,.m4a"></label><label class="fileButton">Open Film Folder<input id="openFolder" type="file" webkitdirectory></label><button id="save">Save Storyboard</button></nav>
  </header>
  <main>
    <aside class="board panel">
      <h2>Storyboard</h2>
      <label>Project Title<input id="projectTitle" maxlength="100"></label>
      <div class="pair"><label>Frame<select id="aspect"></select></label><label>Frame Rate<select id="fps"><option>24</option><option>30</option><option>60</option></select></label></div>
      <div id="customSize" class="pair" hidden><label>Width<input id="customWidth" type="number" min="240" max="4096" step="2"></label><label>Height<input id="customHeight" type="number" min="240" max="4096" step="2"></label></div>
      <label id="captionsField" class="check" hidden><input id="showCaptions" type="checkbox">Show Captions</label>
      <p id="filmNote" class="note" hidden></p>
      <div id="scenes" class="scenes" aria-label="Select A Scene"></div>
      <button id="addScene" class="full">Add Scene</button>
      <div class="order"><button id="up">Move Up</button><button id="down">Move Down</button></div>
      <div class="order"><button id="duplicate">Duplicate</button><button id="remove">Remove</button></div>
      <button id="sheet" class="full secondary">Download Cue Sheet</button>
    </aside>

    <section class="monitor" aria-label="Animation Monitor">
      <div class="stage"><canvas id="frame" width="540" height="960" aria-label="Animated Storyboard Frame"></canvas></div>
      <div class="transport">
        <button id="play">Play</button><label class="slider"><span class="sr">Timeline Position</span><input id="seek" type="range" min="0" max="10" step="0.01" value="0"></label><output id="clock">0.00 / 0.00</output>
      </div>
      <div class="review panel">
        <h2>Review And Export</h2>
        <button id="review">Review From Start</button>
        <label class="check"><input id="approve" type="checkbox" disabled>I Reviewed This Entire Cut And Approve This Version For Export.</label>
        <button id="export" class="full" disabled>Export Approved Video</button>
      </div>
      <p id="status" role="status" aria-live="polite">Save A Storyboard To Keep Your Edits.</p>
    </section>

    <aside class="inspector panel">
      <h2>Scene Editor</h2>
      <div class="pair"><label>Scene Type<select id="mode"></select></label><label>Seconds<input id="duration" type="number" step="0.1" min="0.25" max="600"></label></div>
      <label id="eyebrowField">Eyebrow<input id="eyebrow" maxlength="110"></label>
      <label><span id="titleLabel">Headline</span><textarea id="title" rows="2" maxlength="110"></textarea></label>
      <label id="bodyField">Supporting Line<textarea id="body" rows="2" maxlength="320"></textarea></label>
      <label id="stepsField" hidden>Steps, One Per Line<textarea id="steps" rows="4" maxlength="365"></textarea></label>
      <fieldset id="codeFields" hidden><legend>Code Scene</legend>
        <label>Draw Function<select id="drawName"></select></label>
        <label>Parameters As JSON<textarea id="params" rows="7" spellcheck="false"></textarea></label>
        <small id="paramsNote"></small>
      </fieldset>
      <div id="typeFields" class="pair"><label>Text Motion<select id="motion"></select></label><label>Mark<select id="mark"></select></label></div>
      <div class="colors"><label>Backdrop<input type="color" id="background"></label><label>Type<input type="color" id="foreground"></label><label>Accent<input type="color" id="accent"></label></div>
      <fieldset id="spaceFields" hidden><legend>3D Scene</legend>
        <label>Mesh<select id="shape"></select></label>
        <div class="pair"><label>Surface<input type="color" id="material"></label><label>Key Light<input type="color" id="light"></label></div>
        <div class="pair"><label>Light Yaw °<input id="lightYaw" type="number" min="-180" max="180" step="1"></label><label>Light Elevation °<input id="lightElevation" type="number" min="-90" max="90" step="1"></label></div>
        <label>Light Intensity<input id="intensity" type="number" min="0" max="2" step="0.05"></label>
        <div class="pair"><label>Camera Yaw °<input id="azimuth" type="number" min="-180" max="180" step="1"></label><label>Elevation °<input id="elevation" type="number" min="-70" max="70" step="1"></label></div>
        <div class="pair"><label>Camera Orbit °<input id="orbit" type="number" min="-180" max="180" step="1"></label><label>Object Spin °<input id="spin" type="number" min="-450" max="450" step="1"></label></div>
        <div class="pair"><label>Distance<input id="distance" type="number" min="3.5" max="9" step="0.1"></label><label>Gloss<input id="gloss" type="number" min="0" max="1" step="0.05"></label></div>
      </fieldset>
      <fieldset><legend>Timed Audio</legend>
        <div id="cues"></div>
        <div class="pair"><button id="addSound">Add Sound</button><button id="addVoice">Add Voice Cue</button></div>
      </fieldset>
    </aside>
  </main>
</body>
</html>
